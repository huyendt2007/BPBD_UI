<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực hiện chỉnh lý, hủy và khôi phục đăng ký</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../Common/style_iframe.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="chinh_ly_common.css">
    <script src="../Common/iframe_helper.js"></script>
    <style>
        .cl-edit-field { padding: 6px 8px; border: 1px solid transparent; border-radius: 6px; }
        .cl-edit-field.cl-modified { background: #FFFBEB; border-color: #F59E0B; }
        .cl-ts-types { display: flex; flex-direction: column; gap: 8px; }
        .cl-ts-detail { margin: 8px 0 6px 26px; padding: 12px 14px; border-left: 3px solid #BFDBFE; background: #F8FAFC; border-radius: 0 6px 6px 0; }
        .cl-ts-item > label { display: flex; gap: 8px; align-items: flex-start; cursor: pointer; font-size: 12.5px; }
        .cl-ts-item > label input { margin-top: 3px; }
        .cl-table-toolbar { display: flex; justify-content: flex-end; margin-bottom: 8px; }
    </style>
</head>
<!-- MH06 - Màn hình Thực hiện chỉnh lý, hủy và khôi phục đăng ký: thuc_hien_chinh_ly_form.html?id={id} -->
<body class="cl-page">
<div class="cl-container">
    <div class="cl-breadcrumb">
        <a href="theo_doi_xu_ly_de_nghi.html"><i class="fa-solid fa-arrow-left"></i> Quản lý Chỉnh lý thông tin, Hủy và Khôi phục đăng ký</a>
        <span>/</span><span>Thực hiện đề nghị</span>
    </div>
    <div class="cl-page-header">
        <h2><i class="fa-solid fa-gears"></i><span id="pageTitle">THỰC HIỆN CHỈNH LÝ, HỦY VÀ KHÔI PHỤC ĐĂNG KÝ</span></h2>
        <div id="pageHeaderRight"></div>
    </div>
    <div id="pageBody"></div>
</div>

<div class="cl-sticky-footer" id="footerBar">
    <button type="button" class="cl-btn cl-btn-outline" id="btnHuyBo"><i class="fa-solid fa-xmark"></i> Hủy bỏ</button>
    <button type="button" class="cl-btn cl-btn-primary" id="btnTrinhKy"><i class="fa-solid fa-paper-plane"></i> Trình ký</button>
</div>

<!-- Popup thêm / sửa dòng dữ liệu (Bên bảo đảm, Bên nhận bảo đảm, Số khung, Phương tiện, Chứng khoán) -->
<div class="cl-modal-overlay" id="rowModal">
    <div class="cl-modal" style="max-width:620px;">
        <div class="cl-modal-header"><h3><i class="fa-solid fa-pen-to-square"></i><span id="rowModalTitle"></span></h3>
            <button type="button" class="cl-modal-close" onclick="CLDK.closeModal('rowModal')"><i class="fa-solid fa-xmark"></i></button></div>
        <div class="cl-modal-body"><div class="cl-grid-2" id="rowModalBody"></div></div>
        <div class="cl-modal-footer">
            <button type="button" class="cl-btn cl-btn-outline" onclick="CLDK.closeModal('rowModal')">Hủy bỏ</button>
            <button type="button" class="cl-btn cl-btn-primary" id="rowModalSave"><i class="fa-solid fa-check"></i> Lưu</button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="chinh_ly_common.js"></script>
<script>
(function () {
    const C = CLDK;
    const $ = C.byId;
    const p = C.getProposal(C.param('id'));
    const body = $('pageBody');

    $('btnHuyBo').onclick = () => C.goList();
    if (!p) { body.innerHTML = banner(C.MSG.INF_SYS_001); $('btnTrinhKy').classList.add('cl-hidden'); return; }
    $('pageTitle').textContent = 'THỰC HIỆN ĐỀ NGHỊ: ' + p.maDeNghi;
    $('pageHeaderRight').innerHTML = C.badge(C.loaiLabel(p), C.loaiClass(p)) + ' ' + C.badge(p.trangThai, C.statusClass(p.trangThai));
    if (!['Chờ thực hiện', 'Bị trả lại'].includes(p.trangThai)) {
        body.innerHTML = banner(C.MSG.ERR_DK_005);
        $('btnTrinhKy').classList.add('cl-hidden');
        return;
    }

    const hs = C.hoSoOf(p);
    const huy = C.huyOf(p);
    const nd = p.noiDung || {};
    const parts = [];

    // ===================== KHỐI THAM CHIẾU ĐỀ NGHỊ ĐÃ DUYỆT =====================
    const d = p.pheDuyet || {};
    let canCu = '';
    if (p.loai === 'CHINH_LY') canCu = C.infoItem('Nội dung sai sót', nd.saiSot, { span: true }) + C.infoItem('Nội dung đề nghị chỉnh lý', nd.deNghi, { span: true }) + C.infoItem('Căn cứ & Lý do sai sót', nd.lyDo, { span: true });
    if (p.loai === 'HUY') canCu = C.infoItem('Hình thức hủy', C.hinhThucHuy(p)) + C.infoItem('Căn cứ & Lý do đề nghị hủy', nd.lyDoHuy, { span: true });
    // Khôi phục: chỉ hiển thị Căn cứ; Khối Thông tin giao dịch hủy hiển thị tại phần nội dung bên dưới
    if (p.loai === 'KHOI_PHUC') canCu = C.infoItem('Căn cứ & Lý do đề nghị khôi phục việc đăng ký', nd.lyDoKhoiPhuc, { span: true });
    parts.push(card('Khối Tham chiếu đề nghị đã duyệt', 'fa-file-circle-check', `<div class="cl-info-grid cl-cols-4">
        ${C.infoItem('Mã đề nghị', `<a class="cl-link" href="lap_de_nghi_chinh_ly.html?id=${p.id}&mode=view" target="_blank" title="Mở Xem chi tiết đề nghị tại tab mới">${C.esc(p.maDeNghi)} <i class="fa-solid fa-up-right-from-square" style="font-size:11px;"></i></a>`, { html: true })}
        ${C.infoItem('Loại đề nghị', C.badge(C.loaiLabel(p), C.loaiClass(p)), { html: true })}
        ${C.infoItem('Số đăng ký', p.soDangKy)}${C.infoItem('Người lập đề nghị', p.nguoiLap)}${C.infoItem('Thời điểm lập', p.thoiDiemLap)}
        ${C.infoItem('Người phê duyệt', d.nguoi)}${C.infoItem('Thời điểm phê duyệt', d.thoiDiem)}${C.infoItem('Hạn hoàn thành', d.han)}
        ${C.infoItem('Ý kiến chỉ đạo', d.yKien, { span: true })}</div>
        <div class="cl-sub-title" style="margin-top:12px;"><span><i class="fa-solid fa-pen-to-square"></i> Căn cứ và nội dung đề xuất</span></div>
        <div class="cl-info-grid">${canCu}</div>`, { id: 'cardThamChieu' }));

    // ===================== KHỐI THÔNG TIN TRẢ LẠI HỒ SƠ =====================
    if (p.traLai && p.traLai.length) {
        const items = p.traLai.slice().reverse().map((t, i) => `<div class="cl-history-item"><div class="cl-history-head"><i class="fa-solid fa-rotate-left"></i> Lần trả lại thứ ${p.traLai.length - i}</div>
            <div class="cl-info-grid">${C.infoItem('Người trả lại', t.nguoi)}${C.infoItem('Thời điểm trả lại', t.thoiDiem)}${t.thoiDiemTrinhLai ? C.infoItem('Thời điểm trình ký lại', t.thoiDiemTrinhLai) : ''}
            ${C.infoItem('Lý do trả lại', t.lyDo, { span: true, danger: true })}</div></div>`).join('');
        parts.push(card('Thông tin trả lại hồ sơ', 'fa-rotate-left', items, { id: 'cardTraLai', danger: true, collapsed: p.trangThai !== 'Bị trả lại' }));
    }

    // ===================== NỘI DUNG THEO LOẠI ĐỀ NGHỊ =====================
    let before = null, after = null;
    const stash = {};       // giữ dữ liệu loại tài sản khi bỏ chọn để chọn lại không mất dữ liệu
    if (p.loai === 'CHINH_LY') {
        before = p.chinhLy ? C.clone(p.chinhLy.before) : C.clone(hs);
        after = p.chinhLy ? C.clone(p.chinhLy.after) : C.clone(hs);
        parts.push(card('Thông tin chung & Nghĩa vụ được bảo đảm', 'fa-file-contract', '<div id="chungHost"></div>', { id: 'cardChung' }));
        parts.push(card('Bên bảo đảm', 'fa-user-shield', '<div id="bbdHost"></div><div class="cl-error" id="errBbd">Đây là trường bắt buộc</div>', { id: 'cardBbd' }));
        parts.push(card('Bên nhận bảo đảm', 'fa-building-columns', '<div id="bnbdHost"></div><div class="cl-error" id="errBnbd">Đây là trường bắt buộc</div>', { id: 'cardBnbd' }));
        parts.push(card('Tài sản bảo đảm', 'fa-boxes-stacked', '<div id="tsHost"></div>', { id: 'cardTs' }));
    } else if (p.loai === 'HUY') {
        const note = `Hệ thống nạp dữ liệu mới nhất của hồ sơ theo Số đăng ký lần đầu. Các tài sản hủy đã được tích chọn sẵn đúng theo đề nghị đã phê duyệt (<b>${C.esc(C.hinhThucHuy(p))}</b>); không được thay đổi tài sản hủy.`;
        parts.push(card('Thông tin hồ sơ đề nghị hủy', 'fa-database', `<div class="cl-banner cl-banner-info"><i class="fa-solid fa-circle-info"></i><div>${note}</div></div><div id="hoSoHost"></div>`, { id: 'cardHoSo' }));
    } else {
        const note = 'Hệ thống nạp dữ liệu theo Số đăng ký hủy, lấy theo dữ liệu đã ghi nhận tại thời điểm hủy. Khi ký số hoàn thành, hệ thống khôi phục hiệu lực cho toàn bộ các tài sản gắn nhãn <b>[Đã hủy]</b>; các tài sản khác của hồ sơ giữ nguyên dữ liệu và trạng thái hiện tại.';
        parts.push(card('Khối Thông tin giao dịch hủy đã thực hiện trước đây', 'fa-clock-rotate-left', `<div class="cl-banner cl-banner-info"><i class="fa-solid fa-circle-info"></i><div>${note}</div></div><div id="gdHuyHost"></div>`, { id: 'cardGdHuy' }));
    }

    body.innerHTML = parts.join('');
    body.querySelectorAll('.cl-card[data-collapsible]').forEach(c => C.collapsible(c));
    if (p.loai === 'KHOI_PHUC' && huy) C.renderGiaoDichHuy($('gdHuyHost'), huy);

    if (p.loai === 'HUY') {
        const v = C.renderHoSo($('hoSoHost'), hs, { loai: 'HUY', checkbox: true, checked: new Set(nd.taiSanHuyIds || []), disabledChecks: true });
        const ht = C.hinhThucHuy(p);
        v.setHinhThuc(C.badge(ht, ht === 'Hủy đăng ký toàn phần' ? 'cl-type-huytoanphan' : 'cl-type-huymotphan'));
    }
    if (p.loai === 'CHINH_LY') { renderChung(); updateTitles(); renderTaiSan(); }

    // ===================== FORM CHỈNH LÝ: THÔNG TIN CHUNG =====================
    function renderChung() {
        const c = after.chung;
        const sel = (key, opts) => `<select class="cl-select" data-chung="${key}">${opts.map(o => `<option value="${C.esc(o)}"${o === c[key] ? ' selected' : ''}>${C.esc(o)}</option>`).join('')}</select>`;
        const fld = (key, label, ctrl, req, cls) => `<div class="cl-form-group cl-edit-field${cls ? ' ' + cls : ''}" data-field="${key}"><label class="cl-label">${label}${req ? ' <span class="cl-req">*</span>' : ''}<span data-hist="${key}"></span></label>${ctrl}<div class="cl-error">Đây là trường bắt buộc</div></div>`;
        $('chungHost').innerHTML = `<div class="cl-grid-3">
            ${fld('coQuan', 'Cơ quan tiếp nhận', sel('coQuan', C.CO_QUAN), true)}
            ${fld('loaiHinh', 'Loại hình giao dịch', sel('loaiHinh', ['Biện pháp bảo đảm', 'Hợp đồng']), true)}
            ${fld('loaiBienPhap', 'Loại biện pháp', sel('loaiBienPhap', [''].concat(C.LOAI_BIEN_PHAP)), true, c.loaiHinh === 'Biện pháp bảo đảm' ? '' : 'cl-hidden')}
            ${fld('loaiHopDong', 'Loại hợp đồng', sel('loaiHopDong', [''].concat(C.LOAI_HOP_DONG)), true, c.loaiHinh === 'Hợp đồng' ? '' : 'cl-hidden')}
            ${fld('soHopDong', 'Số hợp đồng', `<input class="cl-input" data-chung="soHopDong" maxlength="100" value="${C.esc(c.soHopDong)}">`, true)}
            ${fld('ngayHieuLucHD', 'Ngày có hiệu lực của hợp đồng', `<input class="cl-input" data-chung="ngayHieuLucHD" placeholder="dd/mm/yyyy" value="${C.esc(c.ngayHieuLucHD)}">`, true)}
            ${fld('giaTri', 'Giá trị khoản vay hoặc nghĩa vụ (VND)', `<input class="cl-input" data-chung="giaTri" value="${C.esc(c.giaTri)}">`, false)}
            ${fld('quyMo', 'Quy mô', sel('quyMo', C.QUY_MO), false)}
            ${fld('chuDNNu', 'Chủ doanh nghiệp là nữ giới?', `<label style="display:inline-flex;gap:8px;align-items:center;margin-top:6px;"><input type="checkbox" data-chung="chuDNNu" ${c.chuDNNu ? 'checked' : ''}> Có</label>`, false)}
        </div>`;
        const ngay = $('chungHost').querySelector('[data-chung="ngayHieuLucHD"]');
        if (window.flatpickr) flatpickr(ngay, { dateFormat: 'd/m/Y', allowInput: true, maxDate: 'today', onChange: () => onChung(ngay) });
        $('chungHost').querySelectorAll('[data-chung]').forEach(el => el.addEventListener(el.type === 'checkbox' || el.tagName === 'SELECT' ? 'change' : 'input', () => onChung(el)));
        Object.keys(c).forEach(markChung);
    }
    function onChung(el) {
        const key = el.getAttribute('data-chung');
        after.chung[key] = el.type === 'checkbox' ? el.checked : el.value.trim();
        if (key === 'loaiHinh') {
            if (after.chung.loaiHinh === 'Hợp đồng') after.chung.loaiBienPhap = ''; else after.chung.loaiHopDong = '';
            renderChung(); updateTitles(); return;
        }
        if (key === 'loaiBienPhap' || key === 'loaiHopDong') updateTitles();
        const grp = el.closest('.cl-edit-field');
        if (grp && String(after.chung[key]).trim()) { el.classList.remove('is-invalid'); grp.querySelector('.cl-error').classList.remove('show'); }
        markChung(key);
    }
    function markChung(key) {
        const grp = $('chungHost').querySelector(`[data-field="${key}"]`);
        if (!grp) return;
        const b = before.chung[key], a = after.chung[key];
        const changed = (b || '') !== (a || '');
        grp.classList.toggle('cl-modified', changed);
        const fmt = v => (typeof v === 'boolean' ? (v ? 'Có' : 'Không') : v);
        grp.querySelector(`[data-hist="${key}"]`).innerHTML = changed ? C.histIcon(fmt(b)) : '';
    }
    function updateTitles() {
        const t = C.partyTitles(after.chung);
        $('cardBbd').querySelector('.cl-card-title').innerHTML = `<i class="fa-solid fa-user-shield"></i> ${C.esc(t.bbd)}`;
        $('cardBnbd').querySelector('.cl-card-title').innerHTML = `<i class="fa-solid fa-building-columns"></i> ${C.esc(t.bnbd)}`;
        $('cardTs').querySelector('.cl-card-title').innerHTML = `<i class="fa-solid fa-boxes-stacked"></i> ${C.esc(t.ts)}`;
        renderParty('bbd'); renderParty('bnbd');
    }

    // ===================== FORM CHỈNH LÝ: BẢNG DỮ LIỆU =====================
    function tableHtml(kind, beforeRows, afterRows, cols, addLabel) {
        const diff = C.diffRows(beforeRows, afterRows, cols);
        let stt = 0;
        const rows = diff.map(dr => {
            const r = dr.row;
            const cls = { modified: 'cl-row-modified', added: 'cl-row-added', removed: 'cl-row-removed' }[dr.status] || '';
            if (dr.status !== 'removed') stt++;
            const cells = cols.map(cc => {
                const v = cc.file ? (r[cc.key] ? `<i class="fa-solid fa-file-pdf" style="color:#EF4444;"></i> ${C.esc(r[cc.key])}` : '-') : C.esc(C.val(r[cc.key]));
                const mod = dr.status === 'modified' && Object.prototype.hasOwnProperty.call(dr.changed, cc.key);
                return `<td class="${cc.center ? 'cl-center ' : ''}${mod ? 'cl-cell-modified' : ''}"${cc.bold ? ' style="font-weight:600;"' : ''}>${v}${mod ? C.histIcon(dr.changed[cc.key]) : ''}</td>`;
            }).join('');
            const act = dr.status === 'removed'
                ? `<button type="button" class="cl-icon-action cl-undo" title="Hoàn tác xóa" data-undo="${kind}|${r.id}"><i class="fa-solid fa-rotate-left"></i></button>`
                : `<button type="button" class="cl-icon-action" title="Sửa" data-edit="${kind}|${r.id}"><i class="fa-solid fa-pen"></i></button><button type="button" class="cl-icon-action cl-del" title="Xóa" data-del="${kind}|${r.id}"><i class="fa-solid fa-trash"></i></button>`;
            return `<tr class="${cls}"><td class="cl-center">${dr.status === 'removed' ? '-' : stt}</td>${cells}<td class="cl-no-strike">${C.TAG[dr.status] || ''}</td><td class="cl-center cl-no-strike" style="white-space:nowrap;">${act}</td></tr>`;
        }).join('');
        return `<div class="cl-table-toolbar"><button type="button" class="cl-btn cl-btn-outline-primary cl-btn-sm" data-add="${kind}"><i class="fa-solid fa-plus"></i> ${C.esc(addLabel)}</button></div>
            <div class="cl-table-wrap"><table class="cl-table"><thead><tr><th class="cl-center" style="width:50px;">STT</th>${cols.map(cc => `<th${cc.center ? ' class="cl-center"' : ''}>${C.esc(cc.label)}</th>`).join('')}<th>Trạng thái chỉnh lý</th><th class="cl-center">Thao tác</th></tr></thead>
            <tbody>${rows || `<tr class="cl-empty-row"><td colspan="${cols.length + 3}">${C.esc(C.MSG.INF_SYS_001)}</td></tr>`}</tbody></table></div>`;
    }
    function renderParty(kind) {
        const t = C.partyTitles(after.chung);
        $(kind + 'Host').innerHTML = tableHtml(kind, before[kind], after[kind], C.COLS[kind], 'Thêm ' + (kind === 'bbd' ? t.bbd : t.bnbd).toLowerCase());
        bindTable($(kind + 'Host'));
    }

    // ===================== FORM CHỈNH LÝ: TÀI SẢN BẢO ĐẢM =====================
    function renderTaiSan() {
        const ts = after.taiSan;
        const blocks = {};
        C.LOAI_TS.filter(lt => ts[lt.key]).forEach(lt => {
            const a = ts[lt.key], b = before.taiSan[lt.key];
            const isNew = !b;
            let inner = '';
            const tf = (k, label, ctrl, req) => {
                const changed = !isNew && (b[k] || '') !== (a[k] || '');
                return `<div class="cl-form-group cl-edit-field${changed ? ' cl-modified' : ''}"><label class="cl-label">${label}${req ? ' <span class="cl-req">*</span>' : ''}${changed ? C.histIcon(b[k]) : ''}</label>${ctrl}<div class="cl-error">Đây là trường bắt buộc</div></div>`;
            };
            if (lt.key === 'CAY' || lt.key === 'DONG_SAN') inner = tf('moTa', 'Mô tả', `<textarea class="cl-textarea" rows="3" data-ts="${lt.key}|moTa" maxlength="2000">${C.esc(a.moTa)}</textarea>`, true);
            else if (lt.key === 'QUYEN') inner = `<div class="cl-grid-2">${tf('tenQuyen', 'Tên quyền', `<input class="cl-input" data-ts="QUYEN|tenQuyen" maxlength="255" value="${C.esc(a.tenQuyen)}">`, true)}${tf('canCu', 'Căn cứ phát sinh quyền', `<textarea class="cl-textarea" rows="2" data-ts="QUYEN|canCu" maxlength="2000">${C.esc(a.canCu)}</textarea>`, true)}</div>`;
            else if (lt.key === 'HANG_HOA') inner = `<div class="cl-grid-2">
                ${tf('kieu', 'Hàng hóa luân chuyển / Kho hàng', `<select class="cl-select" data-ts="HANG_HOA|kieu">${['Hàng hóa luân chuyển', 'Kho hàng'].map(o => `<option${o === a.kieu ? ' selected' : ''}>${o}</option>`).join('')}</select>`, true)}
                ${tf('giaTri', 'Giá trị hàng hóa/Tên, loại hàng hóa', `<input class="cl-input" data-ts="HANG_HOA|giaTri" maxlength="255" value="${C.esc(a.giaTri)}">`, true)}
                ${a.kieu === 'Kho hàng' ? tf('diaChiKho', 'Địa chỉ kho hàng', `<input class="cl-input" data-ts="HANG_HOA|diaChiKho" maxlength="500" value="${C.esc(a.diaChiKho)}">`, true)
                    + tf('soHieuKho', 'Số hiệu kho hàng/Dấu hiệu khác của vị trí kho hàng', `<input class="cl-input" data-ts="HANG_HOA|soHieuKho" maxlength="255" value="${C.esc(a.soHieuKho)}">`, false) : ''}</div>`;
            else {
                const label = lt.key === 'SO_KHUNG' ? 'Thêm số khung' : (lt.key === 'PHUONG_TIEN' ? 'Thêm phương tiện' : 'Thêm thời điểm đăng ký chứng khoán');
                inner = tableHtml('ts:' + lt.key, b ? b.rows : [], a.rows, C.COLS[lt.key], label) + `<div class="cl-error" data-ts-err="${lt.key}">Đây là trường bắt buộc</div>`;
            }
            blocks[lt.key] = inner;
        });
        // Mỗi Loại tài sản: checkbox, ngay bên dưới là khối nhập thông tin của loại đó (khi được tích chọn)
        $('tsHost').innerHTML = `<div class="cl-sub-title"><span>Loại tài sản <span class="cl-req" style="color:#EF4444;">*</span></span></div>
            <div class="cl-ts-types">${C.LOAI_TS.map(lt => {
                const tag = ts[lt.key] && !before.taiSan[lt.key] ? C.TAG.added : (before.taiSan[lt.key] && !ts[lt.key] ? C.TAG.removed : '');
                return `<div class="cl-ts-item" data-asset="${lt.key}">
                    <label><input type="checkbox" data-loai-ts="${lt.key}" ${ts[lt.key] ? 'checked' : ''}> <span>${C.esc(lt.ten)}${tag ? ' ' + tag : ''}</span></label>
                    ${blocks[lt.key] !== undefined ? `<div class="cl-ts-detail">${blocks[lt.key]}</div>` : ''}</div>`;
            }).join('')}</div>
            <div class="cl-error" id="errLoaiTs">Đây là trường bắt buộc</div>`;
        $('tsHost').querySelectorAll('[data-loai-ts]').forEach(chk => chk.addEventListener('change', () => {
            const k = chk.getAttribute('data-loai-ts');
            if (chk.checked) {
                ts[k] = stash[k] || (before.taiSan[k] ? C.clone(before.taiSan[k]) : emptyTs(k));
            } else { stash[k] = ts[k]; delete ts[k]; }
            renderTaiSan();
        }));
        $('tsHost').querySelectorAll('[data-ts]').forEach(el => el.addEventListener(el.tagName === 'SELECT' ? 'change' : 'input', () => {
            const [k, f] = el.getAttribute('data-ts').split('|');
            ts[k][f] = el.value;
            if (el.value.trim()) { el.classList.remove('is-invalid'); const e = el.parentElement.querySelector('.cl-error'); if (e) e.classList.remove('show'); }
            if (el.tagName === 'SELECT') { renderTaiSan(); return; }
            const grp = el.closest('.cl-edit-field');
            const b = before.taiSan[k];
            if (grp && b) {
                const changed = (b[f] || '') !== (el.value || '');
                grp.classList.toggle('cl-modified', changed);
                const lbl = grp.querySelector('.cl-label');
                const old = lbl.querySelector('.cl-hist');
                if (old) old.remove();
                if (changed) lbl.insertAdjacentHTML('beforeend', C.histIcon(b[f]));
            }
        }));
        bindTable($('tsHost'));
    }
    function emptyTs(k) {
        if (C.TABLE_TS.includes(k)) return { rows: [] };
        if (k === 'QUYEN') return { tenQuyen: '', canCu: '' };
        if (k === 'HANG_HOA') return { kieu: 'Hàng hóa luân chuyển', giaTri: '', diaChiKho: '', soHieuKho: '' };
        return { moTa: '' };
    }

    // ===================== THÊM / SỬA / XÓA DÒNG =====================
    function rowsOf(kind, src) {
        const s = src || after;
        if (kind.indexOf('ts:') === 0) { const k = kind.slice(3); return s.taiSan[k] ? s.taiSan[k].rows : []; }
        return s[kind];
    }
    function colsOf(kind) { return kind.indexOf('ts:') === 0 ? C.COLS[kind.slice(3)] : C.COLS[kind]; }
    function rerender(kind) { if (kind.indexOf('ts:') === 0) renderTaiSan(); else renderParty(kind); }
    function bindTable(scope) {
        scope.querySelectorAll('[data-add]').forEach(b => b.onclick = () => openRow(b.getAttribute('data-add'), null));
        scope.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => { const [k, id] = b.getAttribute('data-edit').split('|'); openRow(k, id); });
        scope.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
            const [k, id] = b.getAttribute('data-del').split('|');
            const rows = rowsOf(k);
            const target = rows.find(r => r.id === id) || {};
            const name = target.ten || target.soKhung || (target.ngay ? `${target.ngay}/${target.thang}/${target.nam}` : 'đã chọn');
            if (!(await C.confirmBox(C.MSG.CFM_SYS_001(name), 'Đồng ý'))) return;
            rows.splice(rows.findIndex(r => r.id === id), 1);
            rerender(k);
        });
        scope.querySelectorAll('[data-undo]').forEach(b => b.onclick = () => {
            const [k, id] = b.getAttribute('data-undo').split('|');
            const orig = rowsOf(k, before).find(r => r.id === id);
            const rows = rowsOf(k);
            const idx = rowsOf(k, before).findIndex(r => r.id === id);
            rows.splice(Math.min(idx, rows.length), 0, C.clone(orig));
            rerender(k);
        });
    }
    function openRow(kind, id) {
        const cols = colsOf(kind);
        const rows = rowsOf(kind);
        const row = id ? rows.find(r => r.id === id) : null;
        const names = { bbd: C.partyTitles(after.chung).bbd, bnbd: C.partyTitles(after.chung).bnbd, 'ts:SO_KHUNG': 'số khung', 'ts:PHUONG_TIEN': 'phương tiện', 'ts:CHUNG_KHOAN': 'thời điểm đăng ký chứng khoán' };
        $('rowModalTitle').textContent = (row ? 'Sửa ' : 'Thêm ') + (names[kind] || '').toLowerCase();
        $('rowModalBody').innerHTML = cols.map(cc => {
            const v = row ? (row[cc.key] || '') : '';
            let ctrl;
            if (cc.type === 'select') ctrl = `<select class="cl-select" data-k="${cc.key}"><option value="">-- Chọn --</option>${cc.options.map(o => `<option${o === v ? ' selected' : ''}>${C.esc(o)}</option>`).join('')}</select>`;
            else if (cc.file) ctrl = `<input type="file" class="cl-input" accept=".pdf" data-k="${cc.key}">${v ? `<div class="cl-hint">Tệp hiện tại: ${C.esc(v)}</div>` : ''}`;
            else ctrl = `<input class="cl-input" data-k="${cc.key}" value="${C.esc(v)}">`;
            return `<div class="cl-form-group${cc.key === 'diaChi' || cc.key === 'ten' ? ' cl-span-all' : ''}"><label class="cl-label">${C.esc(cc.label)}${cc.req ? ' <span class="cl-req">*</span>' : ''}</label>${ctrl}<div class="cl-error">Đây là trường bắt buộc</div></div>`;
        }).join('');
        $('rowModalSave').onclick = () => {
            const data = {};
            let first = null;
            cols.forEach(cc => {
                const el = $('rowModalBody').querySelector(`[data-k="${cc.key}"]`);
                let v = cc.file ? (el.files[0] ? el.files[0].name : (row ? row[cc.key] : '')) : el.value.trim();
                data[cc.key] = v;
                const bad = cc.req && !v;
                el.classList.toggle('is-invalid', bad);
                el.parentElement.querySelector('.cl-error').classList.toggle('show', bad);
                if (bad && !first) first = el;
            });
            if (first) { first.focus(); return; }
            if (row) Object.assign(row, data); else rows.push(Object.assign({ id: 'new' + Date.now() }, data));
            C.closeModal('rowModal');
            rerender(kind);
        };
        C.openModal('rowModal');
    }

    // ===================== TRÌNH KÝ =====================
    function validateChinhLy() {
        let first = null;
        const flag = (el, bad, errEl) => {
            if (!el) return;
            el.classList.toggle('is-invalid', bad);
            const e = errEl || (el.closest('.cl-form-group') ? el.closest('.cl-form-group').querySelector('.cl-error') : null);
            if (e) e.classList.toggle('show', bad);
            if (bad && !first) first = el;
        };
        const c = after.chung;
        ['coQuan', 'loaiHinh', 'soHopDong', 'ngayHieuLucHD'].concat(c.loaiHinh === 'Hợp đồng' ? ['loaiHopDong'] : ['loaiBienPhap']).forEach(k => {
            flag($('chungHost').querySelector(`[data-chung="${k}"]`), !String(c[k] || '').trim());
        });
        flag($('bbdHost').querySelector('[data-add]'), !after.bbd.length, $('errBbd'));
        flag($('bnbdHost').querySelector('[data-add]'), !after.bnbd.length, $('errBnbd'));
        const keys = Object.keys(after.taiSan);
        flag($('tsHost').querySelector('[data-loai-ts]'), !keys.length, $('errLoaiTs'));
        keys.forEach(k => {
            const a = after.taiSan[k];
            if (C.TABLE_TS.includes(k)) {
                flag($('tsHost').querySelector(`[data-add="ts:${k}"]`), !a.rows.length, $('tsHost').querySelector(`[data-ts-err="${k}"]`));
            } else {
                const req = k === 'QUYEN' ? ['tenQuyen', 'canCu'] : (k === 'HANG_HOA' ? (a.kieu === 'Kho hàng' ? ['kieu', 'giaTri', 'diaChiKho'] : ['kieu', 'giaTri']) : ['moTa']);
                req.forEach(f => flag($('tsHost').querySelector(`[data-ts="${k}|${f}"]`), !String(a[f] || '').trim()));
            }
        });
        if (first) {
            const cardEl = first.closest('.cl-card');
            if (cardEl) cardEl.classList.remove('cl-collapsed');
            first.scrollIntoView({ behavior: 'smooth', block: 'center' });
            if (first.focus) first.focus();
            return false;
        }
        return true;
    }

    $('btnTrinhKy').onclick = () => {
        if (p.loai === 'CHINH_LY' && !validateChinhLy()) return;
        const getDraft = () => (p.loai === 'CHINH_LY' ? { before, after } : null);
        C.openTrinhKy(p, getDraft, lanhDao => {
            const cur = C.getProposal(p.id);
            if (!cur || !['Chờ thực hiện', 'Bị trả lại'].includes(cur.trangThai)) { C.toast(C.MSG.ERR_DK_005, 'error'); return; }
            const now = C.fmtDateTime(new Date());
            const last = cur.traLai && cur.traLai[cur.traLai.length - 1];
            if (last && !last.thoiDiemTrinhLai) last.thoiDiemTrinhLai = now;
            cur.trangThai = 'Chờ ký số';
            cur.trinhKy = { nguoi: cur.pheDuyet ? cur.pheDuyet.nguoiThucHien : C.CURRENT_USER.ten, thoiDiem: now, lanhDao };
            cur.thoiDiemGui = now;
            if (cur.loai === 'CHINH_LY') cur.chinhLy = { before, after };
            C.updateProposal(cur);
            C.goList(C.MSG.SUC_CLDK_004(cur.maDeNghi));
        });
    };

    // ===================== TIỆN ÍCH =====================
    function card(title, icon, inner, o) {
        const opt = o || {};
        return `<div class="cl-card${opt.danger ? ' cl-card-danger' : ''}${opt.collapsed ? ' cl-collapsed' : ''}" id="${opt.id || ''}"${opt.id === 'cardThamChieu' || opt.id === 'cardTraLai' ? ' data-collapsible="1"' : ''}>
            <div class="cl-card-header"><span class="cl-card-title"><i class="fa-solid ${icon}"></i> ${C.esc(title)}</span></div>
            <div class="cl-card-body">${inner}</div></div>`;
    }
    function banner(msg) { return `<div class="cl-banner cl-banner-warn"><i class="fa-solid fa-triangle-exclamation"></i> ${C.esc(msg)}</div>`; }
})();
</script>
</body>
