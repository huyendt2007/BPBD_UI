<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cấu hình luồng xử lý</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="quan_ly_boi_thuong.css">
    <style>
        body { background: var(--bg-body); padding: 20px; }
        .page-heading { margin-bottom: 16px; padding-right: 360px; }
        .page-heading h2 { color: var(--primary-light); display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 700; margin: 0; }
        .layout { display: grid; grid-template-columns: 340px 1fr; gap: 16px; align-items: start; }
        .card { background: #fff; border: 1px solid var(--border-color); border-radius: var(--border-radius-md); box-shadow: var(--box-shadow); }
        .card-head { padding: 12px 16px; border-bottom: 1px solid var(--border-color); font-weight: 700; color: var(--primary-light); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
        .card-body { padding: 14px 16px; }
        .root-item { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 12px; border: 1px solid var(--border-color); border-radius: 8px; margin-bottom: 8px; cursor: pointer; }
        .root-item:hover { background: #f8fafc; }
        .root-item.active { border-color: var(--primary-light); background: #eff6ff; }
        .root-name { font-weight: 600; color: #0f172a; font-size: 13px; }
        .pill { font-size: 11.5px; font-weight: 600; border-radius: 999px; padding: 2px 9px; white-space: nowrap; }
        .pill.ok { background: #dcfce7; color: #15803d; }
        .pill.no { background: #fee2e2; color: #b91c1c; }
        .node { border: 1px solid var(--border-color); border-radius: 8px; margin-bottom: 12px; }
        .node-head { background: #f8fafc; padding: 10px 14px; border-bottom: 1px solid var(--border-color); border-radius: 8px 8px 0 0; font-weight: 700; color: #0f172a; display: flex; align-items: center; gap: 8px; }
        .node-body { padding: 12px 14px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
        .node-body .col-title { font-weight: 600; font-size: 12.5px; color: #334155; margin-bottom: 6px; display: flex; gap: 6px; align-items: center; }
        .check-list { display: flex; flex-direction: column; gap: 5px; border: 1px solid var(--border-color); border-radius: 6px; padding: 8px 10px; max-height: 170px; overflow-y: auto; font-size: 12.5px; }
        .check-list label { display: flex; gap: 6px; align-items: flex-start; cursor: pointer; }
        .check-list.disabled { opacity: 0.45; pointer-events: none; }
        .muted { color: var(--text-muted); font-size: 12px; }
        .flow-preview { background: #f8fafc; border: 1px dashed var(--border-color); border-radius: 8px; padding: 10px 14px; font-size: 13px; line-height: 1.7; margin-bottom: 14px; }
        .footer-bar { display: flex; justify-content: flex-end; gap: 10px; padding: 12px 16px; border-top: 1px solid var(--border-color); background: #fafbfd; border-radius: 0 0 var(--border-radius-md) var(--border-radius-md); }
        @media (max-width: 1000px) { .layout { grid-template-columns: 1fr; } .node-body { grid-template-columns: 1fr; } .page-heading { padding-right: 0; padding-top: 40px; } }
    </style>
</head>

<body>
    <main>
        <div class="page-heading">
            <h2><i class="fa-solid fa-sitemap"></i> CẤU HÌNH LUỒNG XỬ LÝ</h2>
        </div>
        <div class="layout">
            <div class="card">
                <div class="card-head"><span><i class="fa-solid fa-building-columns"></i> Đơn vị gốc</span></div>
                <div class="card-body">
                    <input id="rootSearch" class="form-control" placeholder="Nhập tên đơn vị..." oninput="renderRoots()" style="margin-bottom:10px;">
                    <div id="rootList"></div>
                </div>
            </div>
            <div class="card">
                <div class="card-head"><span id="cfgTitle">Cấu hình luồng</span><span id="cfgState"></span></div>
                <div class="card-body">
                    <div class="flow-preview" id="flowPreview"></div>
                    <div id="nodeList"></div>
                </div>
                <div class="footer-bar">
                    <button class="btn btn-secondary" onclick="restoreSaved()"><i class="fa-solid fa-rotate-left"></i> Hủy thay đổi</button>
                    <button class="btn btn-primary" onclick="saveConfig()"><i class="fa-solid fa-floppy-disk"></i> Lưu cấu hình</button>
                </div>
            </div>
        </div>
    </main>
    <div id="toast" class="toast-notif"></div>

    <script src="btnn_luong_xu_ly.js"></script>
    <script>
        const WF = BTNN_WF;
        let selectedRoot = 'BTP-01';
        let draft = null; // cấu hình đang chỉnh sửa của đơn vị gốc được chọn

        function esc(v) { return WF.esc(v); }

        function init() {
            WF.mountUserSwitcher();
            const me = WF.getCurrentUser();
            selectedRoot = WF.getRootId(me.unitId) || 'BTP-01';
            renderRoots();
            selectRoot(selectedRoot);
        }

        function renderRoots() {
            const q = document.getElementById('rootSearch').value.trim().toLowerCase();
            document.getElementById('rootList').innerHTML = WF.getRootUnits()
                .filter(u => !q || u.name.toLowerCase().includes(q))
                .map(u => `<div class="root-item ${u.id === selectedRoot ? 'active' : ''}" onclick="selectRoot('${esc(u.id)}')">
                    <div><div class="root-name">${esc(u.name)}</div><div class="muted">${WF.getDescendants(u.id).length} đơn vị trực thuộc</div></div>
                    <span class="pill ${WF.isUnitConfigured(u.id) ? 'ok' : 'no'}">${WF.isUnitConfigured(u.id) ? 'Đã cấu hình' : 'Chưa cấu hình'}</span>
                </div>`).join('');
        }

        function blankNode() { return { leaders: [], allowUnit: false, units: [], allowOfficer: false, officers: [] }; }

        function selectRoot(id) {
            selectedRoot = id;
            const cfg = WF.getFlowConfig();
            draft = JSON.parse(JSON.stringify(cfg[id] || {}));
            [id].concat(WF.getDescendants(id)).forEach(u => { if (!draft[u]) draft[u] = blankNode(); });
            renderRoots();
            renderConfig();
        }

        function depthOf(unitId) { return WF.getAncestors(unitId).length - 1; }

        function renderConfig() {
            const root = WF.getUnit(selectedRoot);
            document.getElementById('cfgTitle').innerHTML = `<i class="fa-solid fa-diagram-project"></i> Cấu hình luồng: ${esc(root.name)}`;
            document.getElementById('cfgState').innerHTML = `<span class="pill ${WF.isUnitConfigured(selectedRoot) ? 'ok' : 'no'}">${WF.isUnitConfigured(selectedRoot) ? 'Đã cấu hình' : 'Chưa cấu hình'}</span>`;
            const units = [selectedRoot].concat(WF.getDescendants(selectedRoot));
            document.getElementById('nodeList').innerHTML = units.map(u => {
                const n = draft[u];
                const unitUsers = WF.USERS.filter(x => x.unitId === u);
                const children = WF.getChildren(u);
                const subUsers = WF.usersInUnitTree(u);
                return `<div class="node" style="margin-left:${depthOf(u) * 24}px;">
                    <div class="node-head"><i class="fa-solid ${depthOf(u) ? 'fa-turn-up fa-rotate-90' : 'fa-building'}" style="color:var(--primary-light);"></i> ${esc(WF.unitName(u))}</div>
                    <div class="node-body">
                        <div>
                            <div class="col-title"><i class="fa-solid fa-user-tie"></i> Nhóm lãnh đạo</div>
                            <div class="check-list">${unitUsers.length ? unitUsers.map(x => `<label><input type="checkbox" ${n.leaders.includes(x.id) ? 'checked' : ''} onchange="toggleArr('${esc(u)}','leaders','${esc(x.id)}',this.checked)"> ${esc(x.name)} <span class="muted">- ${esc(x.title)}</span></label>`).join('') : '<span class="muted">Đơn vị chưa có tài khoản cán bộ.</span>'}</div>
                        </div>
                        <div>
                            <div class="col-title"><label style="display:flex; gap:6px; align-items:center; cursor:pointer;"><input type="checkbox" ${n.allowUnit ? 'checked' : ''} ${children.length ? '' : 'disabled'} onchange="setFlag('${esc(u)}','allowUnit',this.checked)"> Cho phép chuyển đơn vị</label></div>
                            <div class="check-list ${n.allowUnit ? '' : 'disabled'}">${children.length ? children.map(c => `<label><input type="checkbox" ${n.units.includes(c.id) ? 'checked' : ''} onchange="toggleArr('${esc(u)}','units','${esc(c.id)}',this.checked)"> ${esc(c.name)}</label>`).join('') : '<span class="muted">Không có đơn vị cấp dưới.</span>'}</div>
                        </div>
                        <div>
                            <div class="col-title"><label style="display:flex; gap:6px; align-items:center; cursor:pointer;"><input type="checkbox" ${n.allowOfficer ? 'checked' : ''} onchange="setFlag('${esc(u)}','allowOfficer',this.checked)"> Cho phép phân công cán bộ</label></div>
                            <div class="check-list ${n.allowOfficer ? '' : 'disabled'}">${subUsers.length ? subUsers.map(x => `<label><input type="checkbox" ${n.officers.includes(x.id) ? 'checked' : ''} onchange="toggleArr('${esc(u)}','officers','${esc(x.id)}',this.checked)"> ${esc(x.name)} <span class="muted">- ${esc(x.title)}</span></label>`).join('') : '<span class="muted">Không có cán bộ.</span>'}</div>
                        </div>
                    </div>
                </div>`;
            }).join('');
            renderPreview();
        }

        // Sơ đồ các nhánh xử lý suy ra từ cấu hình đang chỉnh sửa
        function renderPreview() {
            const lines = [];
            (function walk(unitId, prefix, seen) {
                const n = draft[unitId];
                if (!n || seen.includes(unitId)) return;
                const label = `${prefix}${prefix ? ' → ' : ''}Lãnh đạo ${WF.unitName(unitId)}${n.leaders.length ? '' : ' (chưa chọn lãnh đạo)'}`;
                let branched = false;
                if (n.allowOfficer && n.officers.length) { lines.push(`${label} → Cán bộ`); branched = true; }
                if (n.allowUnit) n.units.forEach(c => { branched = true; walk(c, label, seen.concat(unitId)); });
                if (!branched) lines.push(`${label} <span style="color:#b91c1c;">(chưa có hướng xử lý)</span>`);
            })(selectedRoot, '', []);
            document.getElementById('flowPreview').innerHTML = `<div style="font-weight:700; margin-bottom:4px;"><i class="fa-solid fa-route"></i> Các nhánh luồng phân công</div>${lines.map(l => `<div>• ${l}</div>`).join('')}<div class="muted" style="margin-top:6px;">Luồng phê duyệt đi ngược chiều luồng phân công thực tế của từng hồ sơ.</div>`;
        }

        function toggleArr(unitId, field, value, on) {
            const arr = draft[unitId][field];
            const i = arr.indexOf(value);
            if (on && i < 0) arr.push(value);
            if (!on && i >= 0) arr.splice(i, 1);
            renderPreview();
        }
        function setFlag(unitId, field, on) { draft[unitId][field] = on; renderConfig(); }

        function validate() {
            const errors = [];
            Object.keys(draft).forEach(u => {
                const n = draft[u];
                const used = u === selectedRoot || Object.values(draft).some(p => p.allowUnit && p.units.includes(u));
                if (!used) return;
                if (!n.leaders.length) errors.push(`${WF.unitName(u)}: chưa chọn nhóm lãnh đạo.`);
                if (n.allowUnit && !n.units.length) errors.push(`${WF.unitName(u)}: đã chọn "Cho phép chuyển đơn vị" nhưng chưa chọn đơn vị nhận.`);
                if (n.allowOfficer && !n.officers.length) errors.push(`${WF.unitName(u)}: đã chọn "Cho phép phân công cán bộ" nhưng chưa chọn cán bộ.`);
                if (!n.allowUnit && !n.allowOfficer) errors.push(`${WF.unitName(u)}: chưa chọn hướng xử lý (chuyển đơn vị hoặc phân công cán bộ).`);
            });
            return errors;
        }

        function saveConfig() {
            const errors = validate();
            if (errors.length) { showToast(errors[0], 'error'); return; }
            const cfg = WF.getFlowConfig();
            const clean = {};
            Object.keys(draft).forEach(u => {
                const n = draft[u];
                if (n.leaders.length || n.allowUnit || n.allowOfficer) clean[u] = { leaders: n.leaders.slice(), allowUnit: n.allowUnit, units: n.allowUnit ? n.units.slice() : [], allowOfficer: n.allowOfficer, officers: n.allowOfficer ? n.officers.slice() : [] };
            });
            cfg[selectedRoot] = clean;
            WF.saveFlowConfig(cfg);
            showToast(`Đã lưu cấu hình luồng xử lý của ${WF.unitName(selectedRoot)}.`, 'success');
            selectRoot(selectedRoot);
        }

        function restoreSaved() { selectRoot(selectedRoot); showToast('Đã hủy các thay đổi chưa lưu.', 'info'); }

        function showToast(message, type) {
            const t = document.getElementById('toast');
            t.className = `toast-notif ${type || 'success'} visible`;
            t.innerHTML = `<i class="fa-solid ${type === 'error' ? 'fa-circle-xmark' : 'fa-circle-check'}"></i><span>${esc(message)}</span>`;
            setTimeout(() => t.classList.remove('visible'), 3200);
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
    <script src="admin-ui-standardizer.js"></script>
</body>

</html>
