<text x="130" y="138.25" font-size="12.5" text-anchor="middle" fill="#111">14. Hoãn giải quyết (Mẫu</text>
<text x="130" y="153.75" font-size="12.5" text-anchor="middle" fill="#111">22/BTNN): khi Xác minh,</text>
<text x="130" y="169.25" font-size="12.5" text-anchor="middle" fill="#111">Thương lượng</text>
<rect x="50" y="238.75" width="160" height="62.5" rx="1" fill="#ffffff" stroke="#333333" stroke-width="1"/>
<text x="130" y="258.25" font-size="12.5" text-anchor="middle" fill="#111">15. Tạm đình chỉ (tải tệp):</text>
<text x="130" y="273.75" font-size="12.5" text-anchor="middle" fill="#111">khi Xác minh, Thương</text>
<text x="130" y="289.25" font-size="12.5" text-anchor="middle" fill="#111">lượng, Chờ ban hành QĐ</text>
<rect x="50" y="351" width="160" height="78" rx="1" fill="#ffffff" stroke="#333333" stroke-width="1"/>
<text x="130" y="370.5" font-size="12.5" text-anchor="middle" fill="#111">16. Đình chỉ giải quyết</text>
<text x="130" y="386" font-size="12.5" text-anchor="middle" fill="#111">(Mẫu 25/BTNN): từ Cử</text>
<text x="130" y="401.5" font-size="12.5" text-anchor="middle" fill="#111">người GQBT đến Hoàn</text>
<text x="130" y="417" font-size="12.5" text-anchor="middle" fill="#111">thành</text>
<rect x="50" y="471" width="160" height="78" rx="1" fill="#ffffff" stroke="#333333" stroke-width="1"/>
<text x="130" y="490.5" font-size="12.5" text-anchor="middle" fill="#111">17. Dừng giải quyết (Mẫu</text>
<text x="130" y="506" font-size="12.5" text-anchor="middle" fill="#111">05/BTNN): từ Cử người</text>
<text x="130" y="521.5" font-size="12.5" text-anchor="middle" fill="#111">GQBT đến Chờ ban hành</text>
<text x="130" y="537" font-size="12.5" text-anchor="middle" fill="#111">QĐ</text>
<rect x="50" y="598.75" width="160" height="62.5" rx="1" fill="#ffffff" stroke="#333333" stroke-width="1"/>
<text x="130" y="618.25" font-size="12.5" text-anchor="middle" fill="#111">18. Tiếp tục giải quyết</text>
<text x="130" y="633.75" font-size="12.5" text-anchor="middle" fill="#111">(Mẫu 23/BTNN): khi Hoãn</text>
<text x="130" y="649.25" font-size="12.5" text-anchor="middle" fill="#111">giải quyết, Tạm đình chỉ</text>
<rect x="258" y="703.25" width="224" height="93.5" rx="8" fill="#fafafa" stroke="#333333" stroke-width="1" stroke-dasharray="4,3"/>
<text x="370" y="722.75" font-size="12.5" text-anchor="middle" fill="#111">Mỗi thao tác: Ký số thì Lãnh đạo ký</text>
<text x="370" y="738.25" font-size="12.5" text-anchor="middle" fill="#111">duyệt các cấp (như bước 6), Từ chối</text>
<text x="370" y="753.75" font-size="12.5" text-anchor="middle" fill="#111">thì Bị trả lại, cập nhật trình lại (bước</text>
<text x="370" y="769.25" font-size="12.5" text-anchor="middle" fill="#111">7); Ký ngoài thì cán bộ ban hành</text>
<text x="370" y="784.75" font-size="12.5" text-anchor="middle" fill="#111">ngay</text>
<rect x="530" y="127" width="160" height="46" rx="1" fill="#c9f1f5" stroke="#333333" stroke-width="1"/>
