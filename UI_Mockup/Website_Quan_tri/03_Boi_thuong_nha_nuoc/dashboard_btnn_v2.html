<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard trực quan về quản lý BTNN</title>
<!-- Trang tổng quan thay theo bản rà soát dashboard_btnn_v2.html (13/11/2026, nhanhl2 yêu cầu): dùng chung chỉ tiêu, kỳ số liệu, đơn vị tiền và bộ lọc với trang Phân tích tình hình BTNN; các khối cố định. -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="vn_34_tinh.js"></script>
<style>
    :root {
        --primary-color: #1E3A8A;
        --primary-hover: #1E40AF;
        --secondary-color: #3B82F6;
        --success-color: #10B981;
        --danger-color: #EF4444;
        --bg-body: #F3F4F6;
        --bg-surface: #FFFFFF;
        --text-main: #1E293B;
        --text-muted: #64748B;
        --border-color: #E2E8F0;
        --table-header-bg: #F1F5F9;
        --font-family: 'Inter', system-ui, -apple-system, sans-serif;
        --box-shadow: 0 4px 6px -1px rgba(0,0,0,0.08), 0 2px 4px -1px rgba(0,0,0,0.05);
        /* Vai trò màu biểu đồ (bảng màu tham chiếu đã kiểm định) */
        --viz-grid: #e1e0d9;
        --viz-axis: #c3c2b7;
        --viz-muted: #898781;
        --viz-ink2: #52514e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font-family); background: var(--bg-body); color: var(--text-main); font-size: 14px; line-height: 1.5; padding: 20px; }
    .container { max-width: 100%; margin: 0 auto; }
    .page-header { margin-bottom: 18px; background: var(--bg-surface); border: 1px solid var(--border-color); padding: 16px 20px; border-radius: 8px; box-shadow: var(--box-shadow); }
    .page-header h1 { font-size: 19px; font-weight: 700; color: var(--primary-color); display: flex; align-items: center; gap: 10px; }
    .card { background: var(--bg-surface); border-radius: 8px; box-shadow: var(--box-shadow); padding: 18px 20px; margin-bottom: 18px; border: 1px solid rgba(0,0,0,0.05); }
    .card-title { color: var(--primary-color); font-size: 15px; font-weight: 600; margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
    .card-title .left { display: flex; align-items: center; gap: 8px; }
    .filter-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
    .form-group { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
    .form-label { font-size: 12.5px; font-weight: 600; color: #334155; }
    .form-label .req { color: var(--danger-color); }
    .form-control { width: 100%; height: 38px; padding: 0 10px; border: 1px solid #CBD5E1; border-radius: 6px; font-family: inherit; font-size: 13.5px; color: var(--text-main); background: #fff; }
    .form-control:focus { outline: none; border-color: var(--secondary-color); box-shadow: 0 0 0 3px rgba(59,130,246,0.15); }
    .filter-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 16px; }
    .btn { height: 38px; padding: 0 16px; border-radius: 6px; font-family: inherit; font-size: 13.5px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; border: 1px solid transparent; }
    .btn-primary { background: var(--primary-color); color: #fff; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-secondary { background: #fff; color: #334155; border-color: #CBD5E1; }
    .btn-secondary:hover { background: #F8FAFC; }
    .btn-sm { height: 30px; padding: 0 10px; font-size: 12.5px; }
    .btn-link { background: none; border: none; color: var(--secondary-color); font-weight: 600; font-size: 12.5px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; padding: 0; }
    .btn-link:hover { text-decoration: underline; }

    /* Thẻ số liệu */
    .kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 18px; }
    .kpi { background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: 8px; padding: 14px 16px; box-shadow: var(--box-shadow); }
    .kpi .lbl { font-size: 12.5px; color: var(--text-muted); font-weight: 500; display: flex; align-items: center; gap: 6px; }
    .kpi .val { font-size: 24px; font-weight: 700; color: var(--text-main); margin-top: 4px; line-height: 1.2; }
    .kpi .sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

    /* Lưới thành phần màn tổng quan */
    .widget-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; align-items: start; }
    .widget-grid .card { margin-bottom: 0; }
    .chart-box { position: relative; height: 300px; }
    .chart-box.tall { height: 360px; }
    /* Ô chọn nhiều giá trị của trang Phân tích tình hình BTNN (bộ mẫu chưa có Combobox chọn nhiều) */
    .ms { position: relative; }
    /* #filterGrid và !important: admin-ui-standardizer.js đặt mọi nút trong khung lọc canh giữa, chữ đậm, và mọi ô nhập cao 38px (kể cả ô đánh dấu) */
    #filterGrid .ms .ms-nut { display: flex !important; width: 100%; padding: 0 10px !important; align-items: center; justify-content: space-between !important; gap: 8px; text-align: left; font-weight: 400 !important; cursor: pointer; }
    /* Thanh phân trang của Bảng số liệu (Số dòng hiển thị 10, 20, 50, 100; «Hiển thị a-b trong tổng số n bản ghi») */
    /* Tab «Nhóm chỉ tiêu» phía trên biểu đồ và bảng số liệu; ô chọn «Chỉ tiêu» nằm cạnh nhóm nút Cột, Tròn, Hình sin */
    .dg-tabs { display: flex; gap: 4px; flex-wrap: wrap; border-bottom: 2px solid var(--border-color); margin-bottom: 14px; }
    .dg-tabs button { height: 40px; padding: 0 18px; background: none; border: none; border-bottom: 3px solid transparent; margin-bottom: -2px; font-family: inherit; font-size: 14px; font-weight: 600; color: #64748B; cursor: pointer; }
    .dg-tabs button:hover { color: var(--primary-color); }
    .dg-tabs button.on { color: var(--primary-color); border-bottom-color: var(--primary-color); }
    /* Chú giải đầy đủ khi có nhiều mục: danh sách cuộn, bấm vào một mục để ẩn hoặc hiện mục đó trên biểu đồ */
    .dg-cg { margin-top: 10px; border: 1px solid var(--border-color); border-radius: 8px; padding: 10px 12px; }
    .dg-cg-ds { max-height: 190px; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 2px 14px; }
    .dg-cg-muc { display: flex; align-items: center; gap: 8px; background: none; border: none; text-align: left; padding: 3px 6px; border-radius: 4px; font-family: inherit; font-size: 12.5px; color: #334155; cursor: pointer; min-width: 0; }
    .dg-cg-muc:hover { background: #F1F5F9; }
    .dg-cg-muc i { flex: none; width: 11px; height: 11px; border-radius: 3px; }
    .dg-cg-muc span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .dg-cg-muc.tat { color: #94A3B8; text-decoration: line-through; }
    .dg-cg-muc.tat i { opacity: .35; }
    .dg-ctrl { display: flex; align-items: center; gap: 10px 22px; flex-wrap: wrap; margin: -4px 0 12px; }
    .dg-ct { display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 600; color: #334155; }
    .dg-ct select { height: 30px; width: auto; max-width: 340px; padding: 0 8px; border: 1px solid #CBD5E1; border-radius: 6px; font-family: inherit; font-size: 12.5px; background: #fff; }
    .th-sort { display: inline-flex; align-items: center; gap: 6px; background: none; border: none; padding: 0; font: inherit; color: inherit; cursor: pointer; white-space: nowrap; }
    .th-sort i { font-size: 11px; color: #94A3B8; }
    .th-sort.on i { color: var(--primary-color); }
    .th-sort:hover { color: var(--primary-color); }
    .dg-loi { color: var(--danger-color); font-size: 12px; margin-top: 2px; }
    #filterGrid .is-invalid { border-color: var(--danger-color) !important; }
    .pg-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 12px; font-size: 13px; color: #475569; }
    .pg-size { display: inline-flex; align-items: center; gap: 8px; }
    .pg-size select { height: 32px; width: auto; padding: 0 8px; border: 1px solid #CBD5E1; border-radius: 6px; font-family: inherit; font-size: 13px; background: #fff; }
    .pg-nut { display: inline-flex; gap: 4px; align-items: center; }
    .pg-nut button { min-width: 32px; height: 32px; padding: 0 8px; border: 1px solid #CBD5E1; background: #fff; border-radius: 6px; font-family: inherit; font-size: 13px; color: #334155; cursor: pointer; }
    .pg-nut button:hover:not(:disabled):not(.on) { background: #F1F5F9; }
    .pg-nut button.on { background: var(--primary-color); border-color: var(--primary-color); color: #fff; font-weight: 600; }
    .pg-nut button:disabled { opacity: .45; cursor: default; }
    #filterGrid .ms input[type="checkbox"] { width: 15px !important; height: 15px !important; min-height: 0 !important; padding: 0 !important; margin: 0 !important; flex: none; }
    .ms-nut .ms-chu { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ms-nut i { color: var(--text-muted); font-size: 11px; }
    .ms-hop { position: absolute; z-index: 60; top: calc(100% + 4px); left: 0; right: 0; min-width: 280px; background: #fff; border: 1px solid #CBD5E1; border-radius: 8px; box-shadow: 0 10px 24px rgba(15,23,42,.14); padding: 8px; }
    .ms-tim { height: 32px; margin-bottom: 6px; font-size: 13px; }
    .ms-ds { max-height: 300px; overflow-y: auto; }
    .ms-muc { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px; font-size: 13px; cursor: pointer; }
    .ms-muc:hover { background: #F1F5F9; }
    .ms-muc.ms-tat { font-weight: 600; border-bottom: 1px solid var(--border-color); border-radius: 0; margin-bottom: 4px; }
    /* Màn tổng quan xếp thành phần vào hai cột so le (thứ tự lẻ bên trái, chẵn bên phải), để thành phần thấp nằm ngay dưới thành phần phía trên, không bị bản đồ cao đẩy xuống (nhanhl2 yêu cầu 13/11/2026) */
    .widget-col { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
    @media (max-width: 1100px) { .widget-grid { display: flex; flex-direction: column; gap: 18px; } .widget-col { display: contents; } }

    /* Chọn loại biểu đồ */
    .seg { display: inline-flex; border: 1px solid #CBD5E1; border-radius: 6px; overflow: hidden; }
    .seg button { height: 30px; padding: 0 12px; background: #fff; border: none; border-left: 1px solid #CBD5E1; font-family: inherit; font-size: 12.5px; font-weight: 600; color: #475569; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
    .seg button:first-child { border-left: none; }
    .seg button.active { background: var(--primary-color); color: #fff; }

    /* Bảng */
    .table-wrap { overflow-x: auto; border: 1px solid var(--border-color); border-radius: 6px; }
    table.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
    table.tbl th { background: var(--table-header-bg); color: #334155; font-weight: 600; text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--border-color); white-space: nowrap; }
    table.tbl td { padding: 8px 12px; border-bottom: 1px solid #F1F5F9; }
    table.tbl td.num, table.tbl th.num { text-align: right; font-variant-numeric: tabular-nums; }
    table.tbl tr:last-child td { border-bottom: none; }
    table.tbl tr.total td { font-weight: 700; background: #F8FAFC; }
    .badge { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; border: 1px solid transparent; }
    .badge.on { background: #ECFDF5; color: #047857; border-color: #A7F3D0; }
    .badge.off { background: #F1F5F9; color: #475569; border-color: #E2E8F0; }
    .lv-dot { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }

    /* Phân tích: biểu đồ + bản đồ */
    .split { display: grid; grid-template-columns: minmax(0, 1fr) 420px; gap: 18px; align-items: start; }
    .split .card { margin-bottom: 0; }

    /* Bản đồ hành chính tỉnh, thành phố */
    .vn-map svg { display: block; width: 100%; max-width: 420px; height: auto; margin: 0 auto; }
    .vn-map .prov path, .vn-map path.prov { stroke: #ffffff; stroke-width: 0.7; stroke-linejoin: round; cursor: pointer; transition: opacity .1s; }
    .vn-map path.prov:hover { stroke: #0b0b0b; stroke-width: 1.4; }
    .vn-map g.isl { cursor: pointer; }
    .vn-map g.isl:hover circle { stroke: #0b0b0b; stroke-width: 1.2; }
    .vn-map .isl-lbl { font-size: 9px; fill: #52514e; font-weight: 600; }
    .map-legend { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 12px; font-size: 12px; color: var(--viz-ink2); }
    .map-legend .sw { display: inline-block; width: 22px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-right: 4px; }
    .map-note { text-align: center; font-size: 11.5px; color: var(--viz-muted); margin-top: 6px; }
    .viz-tip { position: fixed; pointer-events: none; background: #fff; border: 1px solid rgba(11,11,11,0.12); box-shadow: 0 6px 16px rgba(0,0,0,0.12); border-radius: 6px; padding: 8px 10px; font-size: 12.5px; color: #0b0b0b; z-index: 50; display: none; min-width: 160px; }
    .viz-tip .t { font-weight: 700; margin-bottom: 3px; }
    .viz-tip .r { display: flex; justify-content: space-between; gap: 14px; color: var(--viz-ink2); }
    .viz-tip .r b { color: #0b0b0b; font-variant-numeric: tabular-nums; }

    /* Popup */
    .modal-backdrop { position: fixed; inset: 0; background: rgba(15,23,42,0.45); display: none; align-items: center; justify-content: center; z-index: 100; }
    .modal-backdrop.visible { display: flex; }
    .modal { background: #fff; border-radius: 10px; width: 720px; max-width: calc(100% - 32px); max-height: calc(100% - 40px); display: flex; flex-direction: column; box-shadow: 0 20px 40px rgba(0,0,0,0.2); }
    .modal-header { padding: 14px 20px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
    .modal-header h3 { font-size: 16px; color: var(--primary-color); display: flex; align-items: center; gap: 8px; }
    .modal-body { padding: 18px 20px; overflow-y: auto; }
    .modal-footer { padding: 12px 20px; border-top: 1px solid var(--border-color); display: flex; justify-content: flex-end; gap: 10px; }
    .icon-btn { width: 30px; height: 30px; border-radius: 6px; border: 1px solid #E2E8F0; background: #fff; color: #475569; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
    .icon-btn.edit { color: #059669; border-color: #A7F3D0; background: #ECFDF5; }
    .icon-btn.edit:hover { background: #D1FAE5; }
    .form-grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .err-text { color: var(--danger-color); font-size: 12px; min-height: 16px; }
    .toast { position: fixed; top: 20px; right: 20px; background: #065F46; color: #fff; padding: 10px 16px; border-radius: 8px; box-shadow: var(--box-shadow); display: none; align-items: center; gap: 8px; z-index: 200; font-size: 13.5px; }
    .empty { text-align: center; color: var(--text-muted); font-style: italic; padding: 28px; }
    @media (max-width: 1280px) { .split { grid-template-columns: 1fr; } }
    @media (max-width: 1100px) { .widget-grid { grid-template-columns: 1fr; } .filter-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
</style>
</head>
<body>
<div class="container">
    <div class="page-header"><h1 id="pageTitle"></h1></div>
    <div class="card" id="filterCard">
        <div class="card-title"><span class="left"><i class="fa-solid fa-filter"></i> Lọc, tìm kiếm thông tin</span></div>
        <div class="filter-grid" id="filterGrid"></div>
        <div class="filter-actions">
            <button class="btn btn-secondary" onclick="resetFilters()"><i class="fa-solid fa-filter-circle-xmark"></i> Xóa bộ lọc</button>
            <button class="btn btn-primary" onclick="applyFilters()"><i class="fa-solid fa-magnifying-glass"></i> Tìm kiếm</button>
        </div>
    </div>
    <div id="content"></div>
</div>

<!-- Popup Cập nhật cấu hình -->
<div class="modal-backdrop" id="cfgModal">
    <div class="modal">
        <div class="modal-header"><h3 id="cfgModalTitle"></h3><button class="icon-btn" onclick="closeCfgModal()" aria-label="Đóng"><i class="fa-solid fa-xmark"></i></button></div>
        <div class="modal-body"><div class="form-grid-2" id="cfgForm"></div></div>
        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="closeCfgModal()">Hủy bỏ</button>
            <button class="btn btn-primary" onclick="saveCfg()"><i class="fa-solid fa-floppy-disk"></i> Lưu</button>
        </div>
    </div>
</div>
<div class="viz-tip" id="vizTip"></div>
<div class="toast" id="toast"><i class="fa-solid fa-circle-check"></i><span id="toastText"></span></div>

<script>
// ===================== Danh mục =====================
const YEARS = [2022, 2023, 2024, 2025, 2026];
const SCORE_YEARS = [2022, 2023, 2024, 2025];          // Năm đánh giá đã có kết quả chấm điểm
const CUR_YEAR = 2026, CUR_SCORE_YEAR = 2025;
const PERIODS = [['thuc_te', 'Báo cáo năm số liệu thực tế (01/01 - 31/10)'], ['chinh_thuc', 'Số liệu thống kê năm chính thức (01/01 - 31/12)']]; // [DM_44]
const LV = ['Quản lý hành chính', 'Tố tụng hình sự', 'Tố tụng dân sự', 'Tố tụng hành chính', 'Thi hành án hình sự', 'Thi hành án dân sự']; // [DM_22]
// Cấp đơn vị của cơ quan giải quyết bồi thường: thuộc tính «Cấp đơn vị» của cơ quan, đơn vị gốc trong Quản lý cơ cấu tổ chức (đơn vị trực thuộc dùng cấp của đơn vị gốc).
// Không dùng danh mục Loại cơ quan báo cáo [DM_43]: danh mục đó chỉ để người lập báo cáo tự chọn loại báo cáo, không phải cấp của đơn vị (nhanhl2 chỉnh 13/11/2026).
const CAP = ['Trung ương', 'Địa phương'];
const LEVELS = ['Tốt', 'Khá', 'Trung bình', 'Yếu'];  // [DM_33] - trừ Chưa xếp loại, Không đánh giá
// Danh mục tỉnh, thành phố [DM_13] và vị trí ô trên bản đồ (cột, hàng) theo vị trí địa lý tương đối
const PROVINCES = [
    ['LCH', 'Tỉnh Lai Châu', 1, 0], ['LCA', 'Tỉnh Lào Cai', 2, 0], ['TQU', 'Tỉnh Tuyên Quang', 3, 0], ['CBA', 'Tỉnh Cao Bằng', 4, 0],
    ['DBI', 'Tỉnh Điện Biên', 0, 1], ['SLA', 'Tỉnh Sơn La', 1, 1], ['PTH', 'Tỉnh Phú Thọ', 2, 1], ['TNG', 'Tỉnh Thái Nguyên', 3, 1], ['LSO', 'Tỉnh Lạng Sơn', 4, 1],
    ['HNO', 'Thành phố Hà Nội', 2, 2], ['BNI', 'Tỉnh Bắc Ninh', 3, 2], ['QNI', 'Tỉnh Quảng Ninh', 4, 2],
    ['NBI', 'Tỉnh Ninh Bình', 2, 3], ['HYE', 'Tỉnh Hưng Yên', 3, 3], ['HPH', 'Thành phố Hải Phòng', 4, 3],
    ['THO', 'Tỉnh Thanh Hóa', 2, 4], ['NAN', 'Tỉnh Nghệ An', 2, 5], ['HTI', 'Tỉnh Hà Tĩnh', 3, 6], ['QTR', 'Tỉnh Quảng Trị', 3, 7],
    ['HUE', 'Thành phố Huế', 3, 8], ['DNA', 'Thành phố Đà Nẵng', 4, 9],
    ['GLA', 'Tỉnh Gia Lai', 3, 10], ['QNG', 'Tỉnh Quảng Ngãi', 4, 10], ['DLA', 'Tỉnh Đắk Lắk', 3, 11], ['KHO', 'Tỉnh Khánh Hòa', 4, 11],
    ['TNI', 'Tỉnh Tây Ninh', 1, 12], ['DNI', 'Tỉnh Đồng Nai', 2, 12], ['LDO', 'Tỉnh Lâm Đồng', 3, 12],

        if (tg) chart('mainChart', { type: 'line', data: { labels: ds.map(x => x.ten), datasets: [lineDs(def[2], ds.map(gt), CAT[0])] }, options: baseOpts({ legend: true, yTitle: donVi }) });
        else {
            const nams = YEARS.filter(y => y <= nam).slice(-5);
            const op = baseOpts({ legend: true, yTitle: donVi });
            // Nhiều đường: chú giải dài che biểu đồ, và nhắc theo cột sẽ liệt kê mọi đường nên bị khuất; chỉ nhắc đường gần con trỏ nhất
            if (chon.length > DG_NGUONG) { op.plugins.legend.display = false; op.interaction = { mode: 'nearest', intersect: false, axis: 'xy' }; cg = { loai: 'line', ten: chon.map(x => x.ten), mau: chon.map((x, i) => CAT[i % CAT.length]) }; }
            chart('mainChart', { type: 'line', data: { labels: nams.map(String), datasets: chon.map((x, i) => lineDs(x.ten, nams.map(y => dgCong(DG_THEO_NAM[y].filter(x.loc))[ct] || 0), CAT[i % CAT.length])) }, options: op });
        }
    } else {
        hop.style.height = Math.max(300, chon.length * 22 + 60) + 'px';
        chart('mainChart', { type: 'bar', data: { labels: chon.map(x => A.chieu === 'dia_phuong' ? provByCode[x.k].short : x.ten), datasets: [barDs(def[2], chon.map(gt), chon.map(() => CAT[0]), { maxBarThickness: 16 })] }, options: baseOpts({ horizontal: true, yTitle: donVi }) });
    }
    if (cg) dgChuGiai(hop, cg);
    // Bảng số liệu: mỗi mục của chiều đang xem 01 dòng, đủ các chỉ tiêu của nhóm
    const cot = nhom.ct.map(c => ({ t: c[2], num: true })).concat(nhom.tyLe ? [{ t: nhom.tyLe[0], num: true }] : []);
    const dong = x => nhom.ct.map(c => fmt(x[c[0]] || 0)).concat(nhom.tyLe ? [nhom.tyLe[1](x)] : []);
    const S = {}; ds.forEach(x => { for (const k in x.v) S[k] = (S[k] || 0) + x.v[k]; });
    const soTyLe = t => { const v = parseFloat(String(t).replace('%', '').replace(',', '.')); return isNaN(v) ? -1 : v; };
    DG_BANG = { head: [{ t: 'STT' }, { t: tg ? 'Năm' : DG_CHIEU.find(x => x[0] === A.chieu)[1] }].concat(cot),
        items: ds.map(x => ({ ten: x.ten, cells: dong(x.v), khoa: nhom.ct.map(c => x.v[c[0]] || 0).concat(nhom.tyLe ? [soTyLe(nhom.tyLe[1](x.v))] : []) })),
        total: !tg && ds.length > 1 ? ['', 'Tổng cộng'].concat(dong(S)) : null, sapCot: -1, sapHuong: 1 };
    DG_TRANG = 1; dgVeBang();
}
// Phân trang Bảng số liệu: dòng Tổng cộng tính trên mọi dòng và hiện ở cuối mỗi trang; Kết xuất Excel xuất mọi dòng
let DG_BANG = null, DG_TRANG = 1, DG_CO = 10;
function dgVeBang() {
    const b = DG_BANG;
    // Sắp xếp theo tiêu đề cột: cột 1 là tên (chữ), các cột sau là số; STT đánh lại theo thứ tự đang hiện
    const its = b.items.slice();
    if (b.sapCot >= 1) its.sort((x, y) => b.sapHuong * (b.sapCot === 1 ? x.ten.localeCompare(y.ten, 'vi') : x.khoa[b.sapCot - 2] - y.khoa[b.sapCot - 2]));
    b.rows = its.map((x, i) => [i + 1, esc(x.ten)].concat(x.cells));
    const n = b.rows.length, so = Math.max(1, Math.ceil(n / DG_CO)); DG_TRANG = Math.min(Math.max(1, DG_TRANG), so);
    const a = (DG_TRANG - 1) * DG_CO, z = Math.min(n, a + DG_CO);
    const box = document.getElementById('tableBox');
    const headHien = b.head.map((h, i) => i === 0 ? h : { ...h, t: `<button type="button" class="th-sort ${b.sapCot === i ? 'on' : ''}" onclick="dgSapBang(${i})" title="Bấm để sắp xếp theo cột này"><span>${h.t}</span>${b.sapCot === i ? `<i class="fa-solid ${b.sapHuong === 1 ? 'fa-arrow-up-short-wide' : 'fa-arrow-down-wide-short'}"></i>` : ''}</button>` });
    box.innerHTML = tableHtml(headHien, b.rows.slice(a, z), b.total);
    TABLE = { head: b.head, rows: b.total ? b.rows.concat([b.total]) : b.rows };   // xuất Excel đủ mọi dòng
    if (!n) return;
    const nut = []; const them = (t, p, on, off, ten) => nut.push(`<button type="button" ${on ? 'class="on" aria-current="page"' : ''} ${off ? 'disabled' : ''} onclick="dgTrang(${p})" ${ten ? `aria-label="${ten}"` : ''}>${t}</button>`);
    them('<i class="fa-solid fa-angles-left"></i>', 1, false, DG_TRANG === 1, 'Trang đầu'); them('<i class="fa-solid fa-angle-left"></i>', DG_TRANG - 1, false, DG_TRANG === 1, 'Trang trước');
    const ds = new Set([1, so, DG_TRANG - 1, DG_TRANG, DG_TRANG + 1].filter(x => x >= 1 && x <= so)); let truoc = 0;
    [...ds].sort((x, y) => x - y).forEach(x => { if (x - truoc > 1) nut.push('<span>…</span>'); them(x, x, x === DG_TRANG, false); truoc = x; });
    them('<i class="fa-solid fa-angle-right"></i>', DG_TRANG + 1, false, DG_TRANG === so, 'Trang sau'); them('<i class="fa-solid fa-angles-right"></i>', so, false, DG_TRANG === so, 'Trang cuối');
    box.insertAdjacentHTML('beforeend', `<div class="pg-bar"><label class="pg-size">Số dòng hiển thị <select onchange="dgCo(this.value)">${[10, 20, 50, 100].map(x => `<option value="${x}" ${x === DG_CO ? 'selected' : ''}>${x}</option>`).join('')}</select></label>
        <span>Hiển thị ${fmt(a + 1)}-${fmt(z)} trong tổng số ${fmt(n)} bản ghi</span><div class="pg-nut">${nut.join('')}</div></div>`);
}
// Số mục hiển thị và chiều sắp xếp (lớn nhất, nhỏ nhất) của biểu đồ; số mục nhớ riêng cho từng loại biểu đồ, 0 là tất cả
const DG_NGUONG = 12;   // quá số mục này thì biểu đồ tròn và hình sin bỏ chú giải
let DG_SL = { bar: 10, pie: 10, line: 5 }, DG_SX = 'lon';
// Chú giải đầy đủ của biểu đồ nhiều mục: bấm một mục để ẩn hoặc hiện mục đó
function dgChuGiai(hop, cg) {
    const c = charts.mainChart, pie = cg.loai === 'pie';
    const hien = i => pie ? c.getDataVisibility(i) : c.isDatasetVisible(i);
    const dat = (i, on) => { if (hien(i) !== on) { if (pie) c.toggleDataVisibility(i); else c.setDatasetVisibility(i, on); } };
    hop.insertAdjacentHTML('afterend', `<div class="dg-cg">
        <div class="dg-cg-ds">${cg.ten.map((t, i) => `<button type="button" class="dg-cg-muc" data-i="${i}" title="${esc(t)}"><i style="background:${cg.mau[i]}"></i><span>${esc(t)}</span></button>`).join('')}</div></div>`);
    const kh = hop.nextElementSibling, muc = [...kh.querySelectorAll('.dg-cg-muc')];
    const ve = () => muc.forEach(b => b.classList.toggle('tat', !hien(+b.dataset.i)));
    muc.forEach(b => { b.onclick = () => { const i = +b.dataset.i; dat(i, !hien(i)); c.update(); ve(); }; });
}
function dgSoMuc(v) { DG_SL[chartType] = +v; render(); }
function dgSapXep(v) { DG_SX = v; render(); }
// Bấm tiêu đề cột: lần 1 tăng dần, lần 2 giảm dần, lần 3 về thứ tự mặc định; luôn về trang 1 (nhanhl2 yêu cầu 13/11/2026)
function dgSapBang(i) { const b = DG_BANG; if (b.sapCot !== i) { b.sapCot = i; b.sapHuong = 1; } else if (b.sapHuong === 1) b.sapHuong = -1; else { b.sapCot = -1; b.sapHuong = 1; } DG_TRANG = 1; dgVeBang(); }
function dgTab(id) { DG.nhom = id; render(); }
function dgChiTieu(v) { DG.ct = v; render(); }
function dgTrang(p) { DG_TRANG = p; dgVeBang(); }
function dgCo(v) { DG_CO = +v; DG_TRANG = 1; dgVeBang(); }

// ===================== Khởi tạo =====================
function render() {
    ({ tong_quan: renderOverview, cau_hinh: renderConfig, pt_ca_nuoc: renderCaNuoc, pt_hoan_tra: renderHoanTra, pt_danh_gia: renderDanhGia })[MODULE]();
}
(function init() {
    const s = SCREENS[MODULE];
    document.title = s.title;
    document.getElementById('pageTitle').innerHTML = `<i class="fa-solid ${s.icon}"></i> ${esc(s.title)}`;
    const c = cfgOf(MODULE); if (s.analysis) chartType = (P.get('chart')) || (c && c.chart) || 'bar';
    renderFilters(true);
    if (!window.Chart) document.getElementById('content').insertAdjacentHTML('beforebegin', '<div class="card empty">Không tải được thư viện biểu đồ. Vui lòng kiểm tra kết nối mạng.</div>');
    render();
    if (MODULE === 'cau_hinh' && P.get('popup') === 'sua') openCfgModal(P.get('id') || 'pt_danh_gia'); // Mở sẵn popup Cập nhật (minh họa)
})();
</script>
