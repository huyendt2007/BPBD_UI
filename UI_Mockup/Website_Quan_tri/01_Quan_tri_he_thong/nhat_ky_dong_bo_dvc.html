<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nhật ký đồng bộ Dịch vụ công</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../03_Boi_thuong_nha_nuoc/quan_ly_boi_thuong.css">
    <style>
        body {
            background: var(--bg-body);
            padding: 20px;
        }

        .lookup-shell {
            width: 100%;
        }

        .page-header {
            margin-bottom: 16px;
        }

        .page-title h2 {
            color: var(--primary-color);
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 20px;
            font-weight: 700;
            line-height: 1.3;
            margin: 0;
        }

        .page-title p {
            color: var(--text-muted);
            font-size: 13px;
            margin-top: 4px;
        }

        .lookup-panel {
            display: none;
        }

        .lookup-panel.active {
            display: block;
        }

        .section-heading {
            margin: 0 0 12px;
        }

        .section-title {
            align-items: center;
            color: var(--primary-light);
            display: flex;
            font-size: 15px;
            font-weight: 700;
            gap: 8px;
        }

        .section-desc {
            color: var(--text-muted);
            font-size: 13px;
            margin-top: 4px;
        }

        .filter-panel {
            background: #fff;
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius-md);
            box-shadow: var(--box-shadow);
            margin-bottom: 16px;
            padding: 16px;
        }

        .filter-grid {
            display: grid;
            gap: 14px;
            grid-template-columns: repeat(4, minmax(0, 1fr));
        }

        .form-block {
            min-width: 0;
        }

        .form-label {
            color: var(--text-main);
            display: block;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .form-control {
            background: #fff;
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius-sm);
            color: var(--text-main);
            font-size: 13px;
            height: 36px;
            outline: none;
            padding: 7px 10px;
            width: 100%;
        }

        .form-control:focus {
            border-color: var(--secondary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        /* Cặp ô "từ ngày - đến ngày" nằm chung một ô lưới để không bị tách sang 2 dòng */
        .date-range {
            align-items: center;
            display: grid;
            gap: 6px;
            grid-template-columns: 1fr auto 1fr;
        }

        .date-range .form-control {
            min-width: 0;
        }

        .date-range-sep {
            color: var(--text-muted);
            font-size: 13px;
            line-height: 1;
        }

        .filter-actions {
            border-top: 1px dashed var(--border-color);
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 14px;
            padding-top: 12px;
        }

        .table-card {
            background: #fff;
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius-md);
            box-shadow: var(--box-shadow);
            overflow: hidden;
        }

        .table-header {
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            padding: 12px 16px;
        }

        .table-title {
            align-items: center;
            color: var(--primary-light);
            display: flex;
            font-size: 14px;
            font-weight: 700;
            gap: 8px;
        }

        .result-count {
            color: var(--text-muted);
            font-size: 12.5px;
        }

        .table-responsive {
            overflow: auto;
        }

        .custom-table {
            min-width: 1680px;
        }

        .custom-table th,
        .custom-table td {
            vertical-align: middle;
        }

        .custom-table tbody tr.lookup-row {
            cursor: pointer;
        }

        .custom-table tbody tr.lookup-row:hover {
            background: #f8fafc;
        }

        .code-cell {
            color: var(--primary-light);
            font-weight: 700;
            text-align: center;
            white-space: nowrap;
        }

        .muted {
            color: var(--text-muted);
            font-size: 12px;
        }

        .nowrap {
            white-space: nowrap;
        }

        .pagination-bar {
            align-items: center;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 16px;
        }

        .pagination-left,
        .pagination-pages {
            align-items: center;
            color: var(--text-muted);
            display: flex;
            flex-wrap: wrap;
            font-size: 13px;
            gap: 8px;
        }

        .page-size-select {
            background: #fff;
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius-sm);
            height: 32px;
            padding: 4px 8px;
        }

        .page-item {
            align-items: center;
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius-sm);
            color: var(--text-main);
            cursor: pointer;
            display: inline-flex;
            height: 30px;
            justify-content: center;
            min-width: 30px;
            padding: 0 8px;
        }

        .page-item.active {
            background: var(--primary-light);
            border-color: var(--primary-light);
            color: #fff;
        }

        .page-item.disabled {
            color: #cbd5e1;
            cursor: not-allowed;
        }

        .toast-notif {
            align-items: center;
            background: #0f172a;
            border-left: 4px solid var(--success-color);
            border-radius: var(--border-radius-md);
            bottom: 20px;
            box-shadow: 0 10px 20px rgba(15, 23, 42, 0.18);
            color: #fff;
            display: none;
            gap: 10px;
            padding: 12px 16px;
            position: fixed;
            right: 20px;
            z-index: 9999;
        }

        /* Vụ việc của cơ quan khác: chỉ xem trên danh sách (Mã hồ sơ GQBT dạng chữ thường, không mở chi tiết) */
        .tcvv-code-plain { color: var(--text-main); white-space: nowrap; cursor: default; }
        .tcvv-vb-more { color: var(--text-muted); font-size: 12px; font-weight: 600; margin-left: 4px; white-space: nowrap; }
        .tcvv-link { color: var(--primary-light); font-weight: 600; text-decoration: underline; cursor: pointer; white-space: nowrap; }
        .tcvv-check { width: 16px; height: 16px; pointer-events: none; accent-color: #1e3a8a; }

        @media (max-width: 1200px) {
            .filter-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 720px) {
            body {
                padding: 12px;
            }

            .filter-actions,
            .pagination-bar {
                align-items: stretch;
                flex-direction: column;
            }

            .filter-grid {
                grid-template-columns: 1fr;
            }

            .btn {
                justify-content: center;
            }
        }

        /* [dvc1] Nhật ký đồng bộ Dịch vụ công */
        .nkdv-notice { display: flex; align-items: flex-start; gap: 8px; border-radius: 6px; padding: 10px 14px; font-size: 13px; margin-bottom: 14px; border: 1px solid #86efac; border-left: 4px solid #166534; background: #f0fdf4; color: #166534; }
        .nkdv-notice.error { background: #fef2f2; border-color: #fecaca; border-left-color: #b91c1c; color: #b91c1c; }
        .nkdv-notice.info { background: #eff6ff; border-color: #bfdbfe; border-left-color: #1e3a8a; color: #1e3a8a; }
        .nkdv-notice > span { flex: 1; }
        .nkdv-notice > button { border: none; background: none; color: inherit; cursor: pointer; font-size: 16px; line-height: 1; }
        .nkdv-fn, .nkdv-err { display: inline-block; max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: middle; }
        .nkdv-err { color: #b91c1c; max-width: 220px; }
        .nkdv-ib { width: 30px; height: 30px; border: 1px solid #e2e8f0; border-radius: 6px; background: #fff; color: #334155; cursor: pointer; margin: 0 2px; }
        .nkdv-ib:hover { background: #f1f5f9; }
        .nkdv-ib-retry { color: #b45309; }
        .nkdv-modal { position: fixed; inset: 0; background: rgba(15, 23, 42, .45); display: none; align-items: flex-start; justify-content: center; z-index: 1000; padding: 32px 16px; overflow-y: auto; }
        .nkdv-modal-box { background: #fff; border-radius: 10px; width: 1000px; max-width: 100%; box-shadow: 0 20px 40px rgba(0, 0, 0, .2); display: flex; flex-direction: column; max-height: calc(100vh - 64px); }
        .nkdv-modal-box.sm { width: 520px; }
        .nkdv-modal-head { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-bottom: 1px solid #e2e8f0; font-weight: 700; color: var(--primary-color); font-size: 15px; }
        .nkdv-modal-head button { border: none; background: none; font-size: 20px; cursor: pointer; color: #64748b; }
        .nkdv-modal-body { padding: 14px 18px; overflow-y: auto; font-size: 13px; }
        .nkdv-modal-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 18px; border-top: 1px solid #e2e8f0; }
        .nkdv-sec { font-weight: 700; color: #1e3a8a; margin: 14px 0 8px; font-size: 13.5px; }
        .nkdv-sec:first-of-type { margin-top: 0; }
        .nkdv-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px 18px; }
        .nkdv-kv > span { display: block; color: #64748b; font-size: 12px; font-weight: 600; }
        .nkdv-kv > b { font-weight: 500; color: #0f172a; word-break: break-word; }
        .nkdv-kv-wide { grid-column: 1 / -1; }
        .nkdv-mono { font-family: Consolas, monospace; font-size: 12px; }
        .nkdv-json { background: #0f172a; color: #e2e8f0; border-radius: 6px; padding: 10px 12px; font-size: 12px; max-height: 280px; overflow: auto; white-space: pre; margin: 0; }
        .nkdv-empty { color: #64748b; font-style: italic; }
        .form-control.is-invalid { border-color: #dc2626; }
        .nkdv-field-err { color: #dc2626; font-size: 12px; margin-top: 4px; display: none; }
        @media (max-width: 760px) { .nkdv-grid { grid-template-columns: minmax(0, 1fr); } }
        /* [dvc2] MH02 - Chi tiết bản tin (dạng trang, cùng phong cách MH03 Tiếp nhận hồ sơ): nền xám nhạt, mỗi khối 01 card, cặp Nhãn - Giá trị, thanh thao tác cố định */
        #nkdvDetailView .inline-form-body { background: #F8FAFC; padding: 20px 24px 56px; max-height: none; overflow: visible; }
        #nkdvDetailView .inline-form-footer { padding: 14px 24px; border-top: 1px solid var(--border-color); background: #FAFBFD; position: sticky; bottom: 0; z-index: 20; box-shadow: 0 -2px 10px rgba(0, 0, 0, .05); display: flex; justify-content: flex-end; gap: 10px; }
        .ro-card { background: #fff; border: 1px solid #E2E8F0; border-radius: 8px; margin-bottom: 16px; box-shadow: 0 1px 2px rgba(15, 23, 42, .04); }
        .ro-card-h { padding: 12px 20px; border-bottom: 1px solid #EEF2F7; font-size: 13px; font-weight: 700; color: #1e3a8a; text-transform: uppercase; letter-spacing: .3px; }
        .ro-card-b { padding: 16px 20px; }
        .ro-grid { display: grid; gap: 16px 24px; }
        .ro-g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
        .ro-span-2 { grid-column: span 2; }
        .ro-span-3 { grid-column: span 3; }
        .ro-full { grid-column: 1 / -1; }
        .ro-f { min-width: 0; }
        .ro-l { font-size: 12.5px; color: #6B7280; line-height: 1.35; margin-bottom: 4px; }
        .ro-v { font-size: 14px; color: #111827; font-weight: 500; line-height: 1.45; overflow-wrap: anywhere; }
        .ro-empty { color: #9CA3AF; font-style: italic; font-weight: 400; }
        .ro-tbl-wrap { border: 1px solid #E2E8F0; border-radius: 8px; overflow-x: auto; background: #fff; }
        table.ro-table { width: 100%; min-width: 640px; border-collapse: collapse; table-layout: fixed; font-size: 13.5px; }
        .ro-table th { background: #F8FAFC; color: #475569; font-size: 12.5px; font-weight: 600; text-align: left; padding: 10px 12px; border-bottom: 1px solid #E2E8F0; }
        .ro-table td { padding: 10px 12px; border-bottom: 1px solid #F1F5F9; color: #111827; vertical-align: middle; }
        .ro-table tbody tr:last-child > td { border-bottom: 0; }
        .ro-ab { height: 30px; display: inline-flex; align-items: center; gap: 6px; border-radius: 6px; border: 1px solid #bfdbfe; background: #eff6ff; color: #2563eb; cursor: pointer; padding: 0 12px; font: inherit; font-size: 12.5px; font-weight: 500; white-space: nowrap; }
        .nkdv-meta .ro-card-b { padding: 14px 20px; }
        .nkdv-meta .ro-v { font-weight: 600; }
        .nkdv-code { display: inline-block; margin-left: 6px; padding: 1px 6px; border-radius: 4px; background: #F1F5F9; color: #475569; font-family: Consolas, monospace; font-size: 11.5px; font-weight: 500; }
        .nkdv-sub { color: #6B7280; font-weight: 400; font-size: 12.5px; }
        .nkdv-mono { font-family: Consolas, 'Courier New', monospace; font-size: 13px; }
        .nkdv-link { color: #2563EB; text-decoration: none; word-break: break-all; }
        .nkdv-link:hover { text-decoration: underline; }
        .nkdv-hash { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .nkdv-hash .nkdv-mono { background: #F8FAFC; border: 1px solid #E2E8F0; border-radius: 6px; padding: 4px 8px; word-break: break-all; }
        .nkdv-copied { align-items: center; gap: 4px; color: #166534; font-size: 12.5px; }
        .nkdv-tech-h { width: 100%; display: flex; justify-content: space-between; align-items: center; background: none; border: 0; border-bottom: 1px solid #EEF2F7; cursor: pointer; text-align: left; font-family: inherit; }
        .nkdv-json-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
        .nkdv-json { background: #0f172a; color: #e2e8f0; border-radius: 6px; padding: 10px 12px; font-family: Consolas, 'Courier New', monospace; font-size: 12px; max-height: 360px; overflow: auto; white-space: pre; margin: 0; }
        @media (max-width: 1100px) { .ro-g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .ro-span-3 { grid-column: 1 / -1; } .nkdv-json-grid { grid-template-columns: minmax(0, 1fr); } }
        @media (max-width: 720px) { .ro-g4 { grid-template-columns: minmax(0, 1fr); } .ro-span-2 { grid-column: auto; } }
    </style>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
</head>

<body>
    <div class="lookup-shell" id="nkdvListView">
        <div class="page-header">
            <div class="page-title">
                <h2>Nhật ký đồng bộ Dịch vụ công</h2>
            </div>
        </div>

        <section class="lookup-panel active" id="nkdvPanel">
            <div id="nkdvNotice" class="nkdv-notice" style="display:none;"></div>
            <div class="filter-panel">
                <div class="filter-grid">
                    <div class="form-block">
                        <label class="form-label" for="nkdvCode">Mã hồ sơ DVC / Mã vụ việc / Mã hồ sơ</label>
                        <input type="text" class="form-control" id="nkdvCode" placeholder="Nhập mã hồ sơ DVC, mã vụ việc hoặc mã hồ sơ">
                    </div>
                    <div class="form-block">
                        <label class="form-label" for="nkdvStep">Bước</label>
                        <select class="form-control" id="nkdvStep"></select>
                    </div>
                    <div class="form-block">
                        <label class="form-label" for="nkdvResult">Kết quả</label>
                        <select class="form-control" id="nkdvResult">
                            <option value="">Tất cả</option>
                            <option value="SUCCESS">Thành công</option>
                            <option value="FAILED">Lỗi</option>
                            <option value="RETRYING">Đang gửi lại</option>
                        </select>
                    </div>
                    <div class="form-block">
                        <label class="form-label" for="nkdvFrom">Thời điểm gửi từ ngày</label>
                        <input type="text" class="form-control" id="nkdvFrom" placeholder="dd/mm/yyyy">
                        <div class="nkdv-field-err" id="nkdvFromErr"></div>
                    </div>
                    <div class="form-block">
                        <label class="form-label" for="nkdvTo">Đến ngày</label>
                        <input type="text" class="form-control" id="nkdvTo" placeholder="dd/mm/yyyy">
                        <div class="nkdv-field-err" id="nkdvToErr"></div>
                    </div>
                </div>
                <div class="filter-actions">
                    <button class="btn btn-secondary" type="button" onclick="nkdvReset()"><i class="fa-solid fa-filter-circle-xmark"></i> Xóa bộ lọc</button>
                    <button class="btn btn-primary" type="button" onclick="nkdvSearch()"><i class="fa-solid fa-magnifying-glass"></i> Tìm kiếm</button>
                </div>
            </div>

            <div class="table-card">
                <div class="table-header">
                    <div style="display:flex; align-items:center; gap:12px;">
                        <div class="table-title"><i class="fa-solid fa-table-list"></i>Danh sách bản tin gửi Dịch vụ công</div>
                        <div class="result-count" id="nkdvCountText">0 bản ghi</div>
                    </div>
                    <button class="btn btn-secondary" type="button" id="nkdvExportBtn" onclick="nkdvExportExcel()"><i class="fa-solid fa-file-excel" style="color:#16a34a;"></i> Kết xuất Excel</button>
                </div>
                <div class="table-responsive">
                    <table class="custom-table" id="nkdvTable">
                        <thead>
                            <tr>
                                <th style="width:52px; text-align:center;">STT</th>
                                <th style="width:150px; text-align:center;">Thời điểm gửi</th>
                                <th style="width:150px;">Mã hồ sơ DVC</th>
                                <th style="width:130px;">Mã vụ việc</th>
                                <th style="width:120px;">Mã hồ sơ</th>
                                <th style="min-width:220px;">Bước</th>
                                <th style="width:150px; text-align:center;">Trạng thái vụ việc gửi</th>
                                <th style="width:120px; text-align:center;">Kết quả</th>
                                <th style="width:80px; text-align:right;">Số lần gửi</th>
                                <th style="min-width:200px;">Thông báo lỗi</th>
                                <th style="width:90px; text-align:center;">Thao tác</th>
                            </tr>
                        </thead>
                        <tbody id="nkdvBody"></tbody>
                    </table>
                </div>
                <div class="pagination-bar">
                    <div class="pagination-left">
                        <span>Số dòng hiển thị:</span>
                        <select class="page-size-select" onchange="nkdvChangePageSize(this.value)">
                            <option value="10">10</option>
                            <option value="20" selected>20</option>
                            <option value="50">50</option>
                        </select>
                        <span>Hiển thị <strong id="nkdvRange">0-0</strong> trong tổng số <strong id="nkdvTotal">0</strong> bản ghi</span>
                    </div>
                    <div class="pagination-pages" id="nkdvPages"></div>
                </div>
            </div>
        </section>
    </div>

    <!-- MH02 - Màn hình Chi tiết bản tin (dạng trang) -->
    <section id="nkdvDetailView" class="inline-form-panel" style="display:none;">
        <div class="inline-form-header">
            <div class="inline-form-title"><i class="fa-solid fa-arrows-rotate"></i> <span id="nkdvDetailTitleText">CHI TIẾT BẢN TIN ĐỒNG BỘ</span></div>
        </div>
        <div class="inline-form-body" id="nkdvDetailBody"></div>
        <div class="inline-form-footer">
            <button type="button" class="btn btn-secondary" id="nkdvDetailClose" onclick="nkdvClose()"><i class="fa-solid fa-arrow-left"></i> Đóng</button>
            <button type="button" class="btn btn-primary" id="nkdvDetailResend" style="display:none;" onclick="nkdvResend(nkdvOpenId)"><i class="fa-solid fa-rotate-right"></i> Gửi lại</button>
        </div>
    </section>

    <!-- Popup Xác nhận gửi lại -->
    <div class="nkdv-modal" id="nkdvConfirmModal" style="align-items:center;">
        <div class="nkdv-modal-box sm">
            <div class="nkdv-modal-head"><span>Xác nhận gửi lại</span><button type="button" title="Đóng" onclick="nkdvConfirmNo()">&times;</button></div>
            <div class="nkdv-modal-body" id="nkdvConfirmText"></div>
            <div class="nkdv-modal-foot">
                <button type="button" class="btn btn-secondary" onclick="nkdvConfirmNo()">Hủy bỏ</button>
                <button type="button" class="btn btn-primary" id="nkdvConfirmYesBtn" onclick="nkdvConfirmYes()">Gửi lại</button>
            </div>
        </div>
    </div>

    <script src="nhat_ky_dong_bo_dvc.js?v=20261030dvc6"></script>
    <script src="admin-ui-standardizer.js?v=20261012"></script>
    <script src="../../Common/grid_align.js?v=20261030s2"></script>
</body>

</html>
